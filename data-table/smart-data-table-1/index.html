<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Data Table | MetaSkillGroup</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- created by metaskillgroup-team -->
    <main class="page">
      <header class="page-head">
        <div>
          <h1>Customers</h1>
          <p>Search, sort, filter, select and export — all in the browser.</p>
        </div>
        <div class="kpis" id="kpis"></div>
      </header>

      <section class="table-card">
        <!-- Toolbar -->
        <div class="toolbar">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
            <input type="search" id="search" placeholder="Search name, email or company" aria-label="Search customers" />
          </label>

          <div class="chips" id="status-chips" role="group" aria-label="Filter by status"></div>

          <div class="tools">
            <label class="select-wrap">
              <span class="sr-only">Plan</span>
              <select id="plan-filter">
                <option value="">All plans</option>
                <option>Starter</option>
                <option>Pro</option>
                <option>Business</option>
              </select>
            </label>

            <div class="dropdown" id="columns-dd">
              <button type="button" class="tool-btn" aria-expanded="false" aria-haspopup="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16M15 4v16" /></svg>
                Columns
              </button>
              <div class="dd-panel" id="columns-panel"></div>
            </div>

            <button type="button" class="tool-btn icon" id="density" aria-pressed="false" aria-label="Compact rows" title="Compact rows">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
            </button>

            <button type="button" class="tool-btn primary" id="export">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14" /></svg>
              Export CSV
            </button>
          </div>
        </div>

        <!-- Bulk action bar (shows when rows are selected) -->
        <div class="bulk" id="bulk" aria-live="polite">
          <span id="bulk-count">0 selected</span>
          <button type="button" data-bulk="active">Mark active</button>
          <button type="button" data-bulk="export">Export selected</button>
          <button type="button" data-bulk="delete" class="danger">Delete</button>
          <button type="button" class="bulk-clear" data-bulk="clear" aria-label="Clear selection">✕</button>
        </div>

        <div class="table-wrap">
          <table id="table">
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="empty" id="empty" hidden>
            <span aria-hidden="true">🗂️</span>
            <h3>No customers found</h3>
            <p>Try a different search or clear the filters.</p>
            <button type="button" id="clear-filters">Clear filters</button>
          </div>
        </div>

        <!-- Footer: summary + pagination -->
        <div class="foot">
          <p id="summary"></p>
          <div class="pager">
            <label>Rows
              <select id="page-size">
                <option>10</option>
                <option>20</option>
                <option>50</option>
              </select>
            </label>
            <nav class="pages" id="pages" aria-label="Pagination"></nav>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-undo">Undo</button></div>

    <script src="script.js"></script>
  </body>
</html>
