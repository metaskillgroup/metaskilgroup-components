<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Testimonial Wall | MetaSkillGroup</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- created by metaskillgroup-team -->
    <section class="testimonials">
      <header class="t-head">
        <span class="eyebrow">Wall of love</span>
        <h1>Don't take our word for it.<br /><em>Take theirs.</em></h1>
        <div class="t-stats">
          <div><strong data-count="12000">0</strong><span>happy customers</span></div>
          <div><strong data-count="4.9" data-decimals="1">0</strong><span>average rating</span></div>
          <div><strong data-count="98" data-suffix="%">0</strong><span>would recommend</span></div>
        </div>
      </header>

      <!-- Rows are filled from script.js -->
      <div class="wall">
        <div class="row" data-direction="left"><div class="track"></div></div>
        <div class="row" data-direction="right"><div class="track"></div></div>
        <div class="row" data-direction="left"><div class="track"></div></div>
      </div>

      <div class="t-cta">
        <a href="#" class="btn">Read all 2,300 reviews</a>
        <a href="#" class="btn btn-outline">Share your story</a>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
