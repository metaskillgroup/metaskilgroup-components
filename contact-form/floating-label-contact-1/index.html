<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floating Label Contact Form | MetaSkillGroup</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- created by metaskillgroup-team -->
    <main class="page">
      <section class="contact">
        <!-- Info panel -->
        <aside class="info">
          <div class="info-top">
            <span class="eyebrow">Contact us</span>
            <h1>Let's build something <em>great</em> together.</h1>
            <p>Tell us about your project — we usually reply within one business day.</p>
          </div>

          <ul class="details">
            <li>
              <span class="d-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 7l9 6 9-6" /></svg></span>
              <div><small>Email</small><a href="mailto:hello@example.com">hello@example.com</a></div>
            </li>
            <li>
              <span class="d-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2" /></svg></span>
              <div><small>Phone</small><a href="tel:+911234567890">+91 12345 67890</a></div>
            </li>
            <li>
              <span class="d-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z" /><circle cx="12" cy="10" r="2.5" /></svg></span>
              <div><small>Office</small><span>Bengaluru, India</span></div>
            </li>
          </ul>

          <div class="socials">
            <a href="#" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><path d="M4 9h4v11H4zM6 3.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM10 9h3.8v1.6h.1c.5-1 1.8-2 3.7-2 4 0 4.4 2.6 4.4 6V20h-4v-4.8c0-1.2 0-2.7-1.6-2.7S14 13.8 14 15.1V20h-4z" /></svg></a>
            <a href="#" aria-label="YouTube"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" /><path d="M10 9l5 3-5 3z" /></svg></a>
            <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" /><circle cx="12" cy="12" r="4" /><circle cx="17.5" cy="6.5" r="1" /></svg></a>
          </div>

          <div class="blob" aria-hidden="true"></div>
        </aside>

        <!-- Form -->
        <div class="form-wrap">
          <form id="contact-form" novalidate>
            <div class="row">
              <div class="field">
                <input type="text" id="name" name="name" placeholder=" " autocomplete="name" required minlength="2" />
                <label for="name">Full name</label>
                <span class="status" aria-hidden="true"></span>
                <small class="error" id="name-error"></small>
              </div>
              <div class="field">
                <input type="email" id="email" name="email" placeholder=" " autocomplete="email" required />
                <label for="email">Email address</label>
                <span class="status" aria-hidden="true"></span>
                <small class="error" id="email-error"></small>
              </div>
            </div>

            <div class="field">
              <select id="topic" name="topic" required>
                <option value="" disabled selected hidden></option>
                <option>New website</option>
                <option>Mobile app</option>
                <option>UI/UX design</option>
                <option>Something else</option>
              </select>
              <label for="topic">What can we help with?</label>
              <span class="status" aria-hidden="true"></span>
              <small class="error" id="topic-error"></small>
            </div>

            <fieldset class="budget">
              <legend>Budget</legend>
              <label><input type="radio" name="budget" value="<50k" checked /><span>&lt; ₹50k</span></label>
              <label><input type="radio" name="budget" value="50k-2L" /><span>₹50k – 2L</span></label>
              <label><input type="radio" name="budget" value="2L-5L" /><span>₹2L – 5L</span></label>
              <label><input type="radio" name="budget" value="5L+" /><span>₹5L+</span></label>
            </fieldset>

            <div class="field">
              <div class="control">
                <textarea id="message" name="message" placeholder=" " rows="5" maxlength="500" required minlength="20"></textarea>
                <label for="message">Tell us about your project</label>
                <span class="counter" id="counter">0 / 500</span>
              </div>
              <small class="error" id="message-error"></small>
            </div>

            <label class="consent">
              <input type="checkbox" id="consent" required />
              <span class="box" aria-hidden="true"></span>
              <span>I agree to the <a href="#">privacy policy</a>.</span>
            </label>
            <small class="error" id="consent-error"></small>

            <button type="submit" class="submit" id="submit">
              <span class="label">Send message</span>
              <svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z" /></svg>
            </button>
          </form>

          <div class="success" id="success" hidden>
            <div class="success-icon" aria-hidden="true">
              <svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" /><path d="M15 27l7 7 15-16" /></svg>
            </div>
            <h2>Message sent!</h2>
            <p>Thanks, <span id="success-name">friend</span> — we'll get back to you within one business day.</p>
            <button type="button" class="again" id="again">Send another message</button>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
