<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day / Night Theme Toggle | MetaSkillGroup</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Set the theme before first paint so there's no flash -->
    <script>
      (() => {
        const saved = localStorage.getItem("theme-preference") || "system";
        const dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <!-- created by metaskillgroup-team -->
    <main class="page">
      <header class="intro">
        <span class="eyebrow">Dark mode toggle</span>
        <h1>Good <span class="day-word">morning</span><span class="night-word">evening</span> ✦</h1>
        <p>Flip the switch — the sun sets, the stars come out and the whole page follows with a circular reveal. Your choice is remembered.</p>
      </header>

      <!-- Big toggle -->
      <div class="hero-toggle">
        <button type="button" class="dn-toggle" role="switch" aria-checked="false" aria-label="Dark mode" style="--s: 2">
          <span class="sky" aria-hidden="true"></span>
          <span class="stars" aria-hidden="true">
            <i style="--x: 18%; --y: 22%; --d: 0s"></i>
            <i style="--x: 30%; --y: 62%; --d: 0.6s"></i>
            <i style="--x: 44%; --y: 30%; --d: 1.1s"></i>
            <i style="--x: 12%; --y: 70%; --d: 0.3s"></i>
            <i style="--x: 52%; --y: 72%; --d: 1.5s"></i>
            <i style="--x: 38%; --y: 14%; --d: 0.9s"></i>
          </span>
          <span class="clouds" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <span class="knob" aria-hidden="true">
            <span class="crater c1"></span>
            <span class="crater c2"></span>
            <span class="crater c3"></span>
          </span>
        </button>
      </div>

      <!-- Settings card showing other sizes + a 3-way preference -->
      <section class="card">
        <div class="card-row">
          <div>
            <h2>Appearance</h2>
            <p>Choose how the interface looks to you.</p>
          </div>
        </div>

        <div class="segmented" role="radiogroup" aria-label="Theme preference">
          <button type="button" role="radio" data-pref="light">☀️ Light</button>
          <button type="button" role="radio" data-pref="dark">🌙 Dark</button>
          <button type="button" role="radio" data-pref="system">💻 System</button>
        </div>

        <div class="sizes">
          <div class="size">
            <button type="button" class="dn-toggle" role="switch" aria-checked="false" aria-label="Dark mode (small)" style="--s: 0.8"><span class="sky"></span><span class="stars"><i style="--x: 22%; --y: 30%; --d: 0s"></i><i style="--x: 40%; --y: 65%; --d: 0.7s"></i></span><span class="clouds"><i></i><i></i><i></i></span><span class="knob"><span class="crater c1"></span><span class="crater c2"></span><span class="crater c3"></span></span></button>
            <small>Small</small>
          </div>
          <div class="size">
            <button type="button" class="dn-toggle" role="switch" aria-checked="false" aria-label="Dark mode (medium)" style="--s: 1.1"><span class="sky"></span><span class="stars"><i style="--x: 22%; --y: 30%; --d: 0s"></i><i style="--x: 40%; --y: 65%; --d: 0.7s"></i><i style="--x: 14%; --y: 66%; --d: 1.2s"></i></span><span class="clouds"><i></i><i></i><i></i></span><span class="knob"><span class="crater c1"></span><span class="crater c2"></span><span class="crater c3"></span></span></button>
            <small>Medium</small>
          </div>
          <div class="size">
            <button type="button" class="dn-toggle" role="switch" aria-checked="false" aria-label="Dark mode (large)" style="--s: 1.4"><span class="sky"></span><span class="stars"><i style="--x: 22%; --y: 30%; --d: 0s"></i><i style="--x: 40%; --y: 65%; --d: 0.7s"></i><i style="--x: 14%; --y: 66%; --d: 1.2s"></i><i style="--x: 48%; --y: 22%; --d: 0.4s"></i></span><span class="clouds"><i></i><i></i><i></i></span><span class="knob"><span class="crater c1"></span><span class="crater c2"></span><span class="crater c3"></span></span></button>
            <small>Large</small>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
