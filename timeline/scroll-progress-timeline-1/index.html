<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Progress Timeline | MetaSkillGroup</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- created by metaskillgroup-team -->
    <header class="hero">
      <span class="eyebrow">Our journey</span>
      <h1>From a laptop in a hostel room to <span>40,000 learners.</span></h1>
      <p>Scroll down — the line fills as you go and every milestone lights up when you reach it.</p>
      <div class="scroll-hint" aria-hidden="true"><span></span></div>
    </header>

    <main class="timeline-wrap" id="timeline-wrap">
      <div class="track" aria-hidden="true"><span class="fill" id="fill"></span></div>
      <!-- Milestones are rendered from script.js -->
      <ol class="timeline" id="timeline"></ol>
    </main>

    <footer class="end">
      <h2>And we're just getting started.</h2>
      <a href="#" class="cta">Join the journey →</a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
